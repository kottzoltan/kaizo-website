[build]
  command = "npm ci"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_shared/**"]
  external_node_modules = ["drizzle-orm", "@netlify/database", "@netlify/identity"]

[build.environment]
  NODE_VERSION = "22"
  KAIZO_TRIAL_DAYS = "60"

# Same-origin proxy to Aivio API — voice agents on the public demo site.
[[redirects]]
  from = "/agent-api/*"
  to = "https://aivio3.netlify.app/:splat"
  status = 200
  force = true

# Legacy login URL → production app
[[redirects]]
  from = "/login.html"
  to = "/app/login.html"
  status = 301
  force = true
