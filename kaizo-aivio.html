<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kaizo — AI ügynök demó (AIVIO)</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#06070f; --cyan:#29acd9; --bd:rgba(255,255,255,.08); --tx:#f0efed; --mu:rgba(240,239,237,.5); }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--tx);
  font-family: 'DM Sans', sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}
.aivio-top {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .6rem .9rem;
  padding: .75rem clamp(.85rem, 3vw, 1.5rem);
  border-bottom: 1px solid var(--bd);
  background: rgba(14, 16, 24, .97);
}
.aivio-top a {
  color: var(--cyan);
  text-decoration: none;
  font-size: .82rem;
  font-weight: 500;
}
.aivio-top a:hover { text-decoration: underline; }
.aivio-brand {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: .92rem;
  color: var(--cyan);
  letter-spacing: .04em;
}
.aivio-note {
  font-size: .68rem;
  color: var(--mu);
  width: 100%;
  text-align: center;
  order: 4;
}
@media (min-width: 640px) {
  .aivio-note { width: auto; order: 0; flex: 1; text-align: center; }
}
.aivio-frame-wrap {
  flex: 1;
  min-height: 0;
  position: relative;
}
.aivio-frame-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
</style>
</head>
<body>
<header class="aivio-top">
  <a href="index.html#demo">← Főoldal</a>
  <span class="aivio-brand">Kaizo × AIVIO</span>
  <a href="https://aivio-592551502751.europe-central2.run.app/" target="_blank" rel="noopener">Új lapon</a>
  <p class="aivio-note">Mikrofon: engedélyezd a böngészőben. Chrome ajánlott.</p>
</header>
<div class="aivio-frame-wrap">
  <iframe
    src="https://aivio-592551502751.europe-central2.run.app/"
    title="AIVIO — AI ügynök demó"
    allow="microphone *; autoplay; display-capture"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</div>
</body>
</html>
